<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GameMaster AI · AI 游戏化企业培训与实战陪练</title>
<meta name="description" content="面向游戏客服团队的 AI 情景对练与游戏化培训系统" />
<link rel="stylesheet" href="./styles.css?v=2" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 30,16 16,30 2,16' fill='%2337e1ff'/%3E%3Cpolygon points='16,7 25,16 16,25 7,16' fill='%23080b11'/%3E%3Ctext x='16' y='20' text-anchor='middle' font-size='11' fill='white' font-family='monospace'%3EG%3C/text%3E%3C/svg%3E" />
</head>
<body>
<div class="bg-layer" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-glow glow-a"></div>
  <div class="bg-glow glow-b"></div>
</div>

<header class="topbar">
  <a class="brand" href="#lobby" id="brand-home" aria-label="GameMaster AI 首页">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 34 34">
        <defs>
          <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#37e1ff" />
            <stop offset="100%" stop-color="#8a7dff" />
          </linearGradient>
        </defs>
        <polygon points="17,1.5 32.5,17 17,32.5 1.5,17" fill="url(#brandGrad)" />
        <polygon points="17,7 27,17 17,27 7,17" fill="#080b11" />
        <text x="17" y="20.5" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#9defff">GM</text>
      </svg>
    </span>
    <span class="brand-text">
      <strong>GameMaster <i>AI</i></strong>
      <small>游戏化培训 · 实战陪练</small>
    </span>
  </a>

  <nav class="tabs" id="nav-tabs" aria-label="主导航">
    <button class="tab active" data-view="lobby">训练大厅</button>
    <button class="tab" data-view="battle" id="tab-battle" hidden>实战对练<span class="live-dot" aria-hidden="true"></span></button>
    <button class="tab" data-view="admin">数据看板</button>
  </nav>

  <div class="top-actions">
    <div class="llm-chip" id="llm-chip" title="本地大模型状态">
      <span class="dot"></span><span class="text">连接中</span>
    </div>
    <button class="trainee-btn" id="trainee-btn" aria-haspopup="true" aria-expanded="false">
      <span class="avatar" id="trainee-btn-avatar">🎮</span>
      <span class="meta"><b id="trainee-btn-name">加载中</b><small id="trainee-btn-rank">—</small></span>
      <span class="chev">▾</span>
    </button>
    <div class="dropdown hidden" id="trainee-menu" role="menu"></div>
  </div>
</header>

<main id="app">
  <section class="view" id="view-lobby">
    <div class="hero-grid" id="lobby-hero"></div>
    <div id="badge-strip" class="badge-strip"></div>
    <div class="section-head">
      <div>
        <p class="eyebrow">TRAINING MAP</p>
        <h2>闯关地图 <span class="muted">8 个情景关卡 · 通过线 80 分</span></h2>
      </div>
      <div class="legend">
        <span><i class="dot passed"></i>已通关</span>
        <span><i class="dot ready"></i>可挑战</span>
        <span><i class="dot locked"></i>未解锁</span>
      </div>
    </div>
    <div id="level-map" class="level-map"></div>
    <div id="recent-runs" class="recent-wrap"></div>
    <footer class="site-foot">GameMaster AI · 演示环境 · 训练数据保存在本机 SQLite 中</footer>
  </section>

  <section class="view" id="view-battle" hidden>
    <div class="battle-head" id="battle-head"></div>
    <div class="battle-grid">
      <aside class="battle-left">
        <div class="panel brief-panel" id="battle-brief"></div>
        <div class="panel knowledge-panel" id="battle-knowledge"></div>
      </aside>
      <section class="panel chat-panel">
        <header class="chat-head">
          <div class="chat-persona" id="chat-persona"></div>
          <div class="chat-status"><span class="pulse-dot"></span><span id="chat-status-text">在线</span></div>
        </header>
        <div class="chat-log" id="chat-log" aria-live="polite"></div>
        <div class="typing hidden" id="typing">
          <span class="typing-avatar" id="typing-avatar">🎮</span>
          <span class="typing-dots"><i></i><i></i><i></i></span>
          <span class="typing-text" id="typing-text">玩家正在输入…</span>
        </div>
        <div class="composer">
          <textarea id="chat-input" rows="2" maxlength="500" placeholder="以客服身份回复玩家…（Enter 发送，Shift + Enter 换行）"></textarea>
          <div class="composer-row">
            <button class="btn ghost small" id="hint-btn">💡 战术提示 <span class="cost">−2</span></button>
            <span class="composer-note" id="composer-note">每条回复都会被实时分析</span>
            <button class="btn primary send" id="send-btn">发送 <kbd>↵</kbd></button>
          </div>
        </div>
      </section>
      <aside class="battle-right">
        <div class="panel emotion-panel" id="emotion-panel"></div>
        <div class="panel hint-panel" id="hint-panel"></div>
        <div class="panel ai-panel" id="ai-panel"></div>
      </aside>
    </div>
  </section>

  <section class="view" id="view-admin" hidden>
    <div id="admin-content"></div>
  </section>
</main>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="loading-overlay" class="loading-overlay hidden" aria-hidden="true">
  <div class="loader-card">
    <div class="loader-orb"><span></span></div>
    <p id="loading-text">正在处理…</p>
  </div>
</div>

<script src="./charts.js?v=2"></script>
<script src="./app.js?v=2"></script>
</body>
</html>
